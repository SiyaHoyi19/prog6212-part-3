name: Build, Test and Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDay.sln --configuration Release --no-build

      - name: Build MVC Docker image
        run: docker build -f RaceDay.Mvc/Dockerfile -t raceday-mvc:part3 .
